[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoride"
version = "1.0.0"
description = "EcoRide FastAPI backend"
requires-python = ">=3.12"

[project.scripts]
ecoride = "cli.giiar:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*", "databases*"]